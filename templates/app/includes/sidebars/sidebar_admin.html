<!-- =========================================================
     SUPER ADMIN SIDEBAR COMPONENT (templates/app/includes/sidebars/sidebar_admin.html)
     Clean ElevenLabs Studio Navigation — No '+' clutter, No Invite card, Direct Logout
     ========================================================= -->
{% set cur_page = admin_page | default('dashboard') %}
<aside class="app-sidebar">
  <div class="sidebar-top">
    <a href="/app/admin" class="brand-row" title="Dectus Home">
      <img src="/static/assets/dectus-icon-black.png" alt="Dectus" class="brand-icon-img" />
      <span class="brand-text">Dectus</span>
    </a>

    <a href="/app/admin" class="nav-item {{ 'active' if cur_page == 'dashboard' else '' }}">
      <span class="nav-item-left">
        <i class="fa-solid fa-house"></i>
        <span class="nav-label">Home</span>
      </span>
    </a>

    <a href="/app/admin/companies" class="nav-item {{ 'active' if cur_page in ['companies', 'company_detail'] else '' }}">
      <span class="nav-item-left">
        <i class="fa-solid fa-building"></i>
        <span class="nav-label">Companies</span>
      </span>
    </a>

    <a href="/app/admin/staff" class="nav-item {{ 'active' if cur_page in ['staff', 'staff_detail'] else '' }}">
      <span class="nav-item-left">
        <i class="fa-solid fa-users"></i>
        <span class="nav-label">Platform Team</span>
      </span>
    </a>

    <a href="/app/admin/subscriptions" class="nav-item {{ 'active' if cur_page == 'subscriptions' else '' }}">
      <span class="nav-item-left">
        <i class="fa-regular fa-credit-card"></i>
        <span class="nav-label">Subscriptions</span>
      </span>
    </a>

    <a href="/app/admin/audit-logs" class="nav-item {{ 'active' if cur_page == 'audit_logs' else '' }}">
      <span class="nav-item-left">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span class="nav-label">Activity Logs</span>
      </span>
    </a>

    <div class="collapsed-divider"></div>
    <div class="nav-section-title">Pinned</div>

    <div id="pinned-nav-list" style="display:flex; flex-direction:column; gap:2px;">
      <a href="/app/admin/studio" class="nav-item {{ 'active' if cur_page == 'studio' else '' }}" data-tool-id="tool-audio-studio" data-icon="fa-solid fa-wave-square" data-label="Audio Studio">
        <span class="nav-item-left"><i class="fa-solid fa-wave-square"></i><span class="nav-label">Audio Studio</span></span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="event.preventDefault(); unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/live-monitor" class="nav-item {{ 'active' if cur_page == 'live_monitor' else '' }}" data-tool-id="tool-live-monitor" data-icon="fa-solid fa-microphone-lines" data-label="Live Mic & Stream">
        <span class="nav-item-left"><i class="fa-solid fa-microphone-lines"></i><span class="nav-label">Live Mic &amp; Stream</span></span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="event.preventDefault(); unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/model-studio" class="nav-item {{ 'active' if cur_page == 'model_studio' else '' }}" data-tool-id="tool-model-studio" data-icon="fa-solid fa-brain" data-label="AI Models & Classes">
        <span class="nav-item-left"><i class="fa-solid fa-brain"></i><span class="nav-label">AI Models &amp; Classes</span></span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="event.preventDefault(); unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/rules" class="nav-item {{ 'active' if cur_page == 'rules' else '' }}" data-tool-id="tool-rules" data-icon="fa-solid fa-sliders" data-label="Alert Rules">
        <span class="nav-item-left"><i class="fa-solid fa-sliders"></i><span class="nav-label">Alert Rules</span></span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="event.preventDefault(); unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/reviews" class="nav-item {{ 'active' if cur_page == 'reviews' else '' }}" data-tool-id="tool-reviews" data-icon="fa-solid fa-headphones-simple" data-label="Review Queue">
        <span class="nav-item-left"><i class="fa-solid fa-headphones-simple"></i><span class="nav-label">Review Queue</span></span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="event.preventDefault(); unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>
    </div>

    <a class="nav-item" id="more-tools-trigger" onclick="toggleMoreToolsPopover(event)">
      <span class="nav-item-left">
        <i class="fa-solid fa-ellipsis"></i>
        <span class="nav-label">More tools</span>
      </span>
      <i class="fa-solid fa-chevron-right nav-plus" style="font-size: 10px;"></i>
    </a>

    <div class="more-tools-popover" id="more-tools-popover" onclick="event.stopPropagation()">
      <div id="more-tools-list" style="display:flex; flex-direction:column; gap:2px;">
        <div class="more-tool-item" data-tool-id="tool-profile" data-icon="fa-regular fa-user" data-label="Account Settings" onclick="window.location.href='/app/profile'">
          <span class="more-tool-left"><i class="fa-regular fa-user"></i><span>Account Settings</span></span>
          <button type="button" class="pin-toggle-btn" title="Pin to sidebar" onclick="pinNavTool(event, this)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
          </button>
        </div>
        <div class="more-tool-item" data-tool-id="tool-csv-export" data-icon="fa-solid fa-download" data-label="Export Reports" onclick="window.location.href='/api/app/admin/export-csv'">
          <span class="more-tool-left"><i class="fa-solid fa-download"></i><span>Export Reports</span></span>
          <button type="button" class="pin-toggle-btn" title="Pin to sidebar" onclick="pinNavTool(event, this)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-bottom" style="border-top: 1px solid #ececee; padding-top: 10px;">
    <div class="workspace-switcher" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
      <div class="ws-left">
        <div class="ws-gradient-dot enterprise"></div>
        <span class="ws-name">{{ user.tenant_name | default('Dectus Global') }}</span>
      </div>
      <a href="/app/logout" class="sidebar-logout-btn" title="Sign Out" style="color:#71717a; font-size:13px; padding:6px 8px; border-radius:7px; text-decoration:none; display:inline-flex; align-items:center; transition:all 0.12s ease;" onmouseover="this.style.background='#fef2f2'; this.style.color='#dc2626';" onmouseout="this.style.background='transparent'; this.style.color='#71717a';">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </a>
    </div>
  </div>
</aside>
