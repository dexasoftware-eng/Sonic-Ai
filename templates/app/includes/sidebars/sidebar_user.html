<!-- =========================================================
     NORMAL USER / RESIDENT SIDEBAR COMPONENT (templates/app/includes/sidebars/sidebar_user.html)
     Production Grade Personal Safety & Monitoring Navigation
     ========================================================= -->
{% set cur_page = user_page | default('dashboard') %}
<aside class="app-sidebar">
  <div class="sidebar-top">
    <a href="/app/user" class="brand-row" title="SonicSentinel AI">
      <img src="/static/assets/dectus-icon-black.png" alt="SonicSentinel" class="brand-icon-img" />
      <span class="brand-text">SonicSentinel</span>
    </a>

    <!-- Core Nav Items with Real Working Routes & Professional Labels -->
    <a href="/app/user" class="nav-item {{ 'active' if cur_page in ['dashboard', 'home'] else '' }}" title="Personal Dashboard">
      <span class="nav-item-left">
        <i class="fa-solid fa-house"></i>
        <span class="nav-label">Safety Dashboard</span>
      </span>
    </a>

    <a href="/app/admin/studio" class="nav-item {{ 'active' if cur_page == 'studio' else '' }}" title="Audio Analysis Studio">
      <span class="nav-item-left">
        <i class="fa-solid fa-sliders"></i>
        <span class="nav-label">Audio Studio</span>
      </span>
    </a>

    <a href="/app/admin/alerts" class="nav-item {{ 'active' if cur_page == 'alerts' else '' }}" title="Personal Safety Alerts">
      <span class="nav-item-left">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span class="nav-label">Safety Alerts</span>
      </span>
    </a>

    <a href="/app/admin/events" class="nav-item {{ 'active' if cur_page == 'events' else '' }}" title="Acoustic Detection Events Archive">
      <span class="nav-item-left">
        <i class="fa-regular fa-folder-open"></i>
        <span class="nav-label">Detection Events</span>
      </span>
    </a>

    <a href="/app/profile" class="nav-item {{ 'active' if cur_page == 'profile' else '' }}" title="Account Settings &amp; Preferences">
      <span class="nav-item-left">
        <i class="fa-regular fa-user"></i>
        <span class="nav-label">Profile Settings</span>
      </span>
    </a>

    <div class="collapsed-divider"></div>
    <div class="nav-section-title">Pinned</div>

    <div id="pinned-nav-list" style="display:flex; flex-direction:column; gap:2px;">
      <a href="/app/admin/events" class="nav-item {{ 'active' if cur_page == 'events' else '' }}" data-tool-id="tool-audio-class" data-icon="fa-solid fa-wave-square" data-label="Acoustic Event Log" title="Acoustic Event Log">
        <span class="nav-item-left">
          <i class="fa-solid fa-wave-square"></i>
          <span class="nav-label">Acoustic Event Log</span>
        </span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/live-monitor" class="nav-item {{ 'active' if cur_page == 'live_monitor' else '' }}" data-tool-id="tool-live-mic" data-icon="fa-solid fa-microphone-lines" data-label="Live Sensor Mic" title="Live Sensor Mic Ingestion">
        <span class="nav-item-left">
          <i class="fa-solid fa-microphone-lines"></i>
          <span class="nav-label">Live Sensor Mic</span>
        </span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/model-studio" class="nav-item {{ 'active' if cur_page in ['model_studio', 'models'] else '' }}" data-tool-id="tool-sound-events" data-icon="fa-solid fa-bolt" data-label="Sound Class Library" title="Sound Class Library">
        <span class="nav-item-left">
          <i class="fa-solid fa-bolt"></i>
          <span class="nav-label">Sound Class Library</span>
        </span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>

      <a href="/app/admin/rules" class="nav-item {{ 'active' if cur_page == 'rules' else '' }}" data-tool-id="tool-consensus" data-icon="fa-solid fa-code-compare" data-label="Dual-AI Consensus" title="Dual-AI Consensus Rules">
        <span class="nav-item-left">
          <i class="fa-solid fa-code-compare"></i>
          <span class="nav-label">Dual-AI Consensus</span>
        </span>
        <button type="button" class="pin-toggle-btn" title="Unpin to More tools" onclick="unpinNavTool(event, this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><line x1="12" y1="17" x2="12" y2="22"/><path d="M9 9v1.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h12"/><path d="M15 9.34V6h1a2 2 0 0 0 0-4H7.89"/></svg>
        </button>
      </a>
    </div>
  </div>

  <div class="sidebar-bottom">
    <div class="workspace-switcher" style="display:flex; align-items:center; justify-content:space-between; width:100%;">
      <div class="ws-left">
        <div class="ws-gradient-dot"></div>
        <span class="ws-name">{{ user.tenant_name | default('Personal Workspace') }}</span>
      </div>
      <a href="/app/logout" class="sidebar-logout-btn" title="Sign Out" style="color:#71717a; font-size:13px; padding:6px 8px; border-radius:7px; text-decoration:none; display:inline-flex; align-items:center; transition:all 0.12s ease;" onmouseover="this.style.background='#fef2f2'; this.style.color='#dc2626';" onmouseout="this.style.background='transparent'; this.style.color='#71717a';">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </a>
    </div>
  </div>
</aside>
