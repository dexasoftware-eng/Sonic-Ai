<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS COMMAND — SECTOR OMEGA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />

    <!-- Tone.js — same audio library the original React app used -->
    <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>

    <!-- Three.js (r128 UMD build + legacy non-module postprocessing addons,
         so everything runs from plain <script> tags without a bundler) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- App scripts — order matters (no bundler / no ES modules,
         everything hangs off a shared window.NEXUS namespace) -->
    <script src="js/colors.js"></script>
    <script src="js/store.js"></script>
    <script src="js/soundEngine.js"></script>
    <script src="js/quantumCore3d.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/bottombar.js"></script>
    <script src="js/leftpanel.js"></script>
    <script src="js/rightpanel.js"></script>
    <script src="js/centerpanel.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
